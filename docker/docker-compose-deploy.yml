version: "3.7"

networks:
  ev_network:
    driver: bridge

volumes:
  mongo-data: {}

services:
  mongodb:
    build:
      context: .
      dockerfile: ev_mongo.Dockerfile
      args:
        mongodb_name: evse
        mongodb_user: mongodb
        mongodb_home: /home/mongodb
        export_file: export-empty-evse-db.zip
    image: evse-mongo:local
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - "mongo-data:/data/db"
    env_file:
      - ev_mongo.env
    command: --replSet 'rs0'
    networks:
      ev_network:
        aliases:
          - ev_mongo

  enablereplset:
    depends_on:
      - mongodb
    build:
      context: replica
    links:
      - mongodb
    networks:
      - ev_network
    environment:
      WAIT_HOSTS: ev_mongo:27017
      WAIT_HOSTS_TIMEOUT: 90

  mailserver:
    image: maildev/maildev
    ports:
      - 587:587
      - 1080:1080
    networks:
      - ev_network
    command: bin/maildev -w 1080 -s 587 --verbose --incoming-user evse-mail-user --incoming-pass evse-mail-pwd

  server:
    depends_on:
      - mongodb
      - enablereplset
      - mailserver
    build:
      context: ..
      dockerfile: docker/ev_server.Dockerfile
      args:
        build: prod
    ports:
      - 81:81
      - 8000:8000
      - 8010:8010
      - 8080:8080
      - 9090:9090
      - 9292:9292
    environment:
      WAIT_HOSTS: ev_mongo:27017
      WAIT_HOSTS_TIMEOUT: 90
      WAIT_AFTER_HOSTS: 3
    networks:
      ev_network:
        aliases:
          - ev_server
